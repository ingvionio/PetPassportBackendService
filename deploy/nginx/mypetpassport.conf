server {
    listen 80;
    server_name mypetpassport.ru;
    return 301 https://$host:4443$request_uri;
}

server {
    listen 4443 ssl;
    server_name mypetpassport.ru;

    ssl_certificate /etc/letsencrypt/live/mypetpassport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypetpassport.ru/privkey.pem;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8443 ssl;
    server_name mypetpassport.ru;

    ssl_certificate /etc/letsencrypt/live/mypetpassport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypetpassport.ru/privkey.pem;

    location /webhook {
        proxy_pass http://telegram-bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
